<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふたりの相性診断(無料・生年月日だけ) | ゆびさき占い</title>
<meta name="description" content="気になる人・恋人・友達との相性を、ふたりの生年月日だけで無料診断。相性スコアとアドバイスつき。登録不要。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="index.html">🌙 ゆびさき占い</a>
  </header>

  <h1>💞 ふたりの相性診断</h1>
  <p class="lead">ふたりの生年月日を入れるだけ。恋人でも、気になる人でも、友達でも。</p>

  <div class="card">
    <label for="b1">あなたの生年月日</label>
    <input type="date" id="b1" min="1930-01-01" max="2012-12-31">
    <label for="b2">相手の生年月日</label>
    <input type="date" id="b2" min="1930-01-01" max="2012-12-31">
    <button class="go" onclick="showAisho()">相性を診断する</button>

    <div class="result" id="result">
      <div class="score"><span id="r-pct"></span><small> %</small></div>
      <h2 id="r-title" style="text-align:center;"></h2>
      <p id="r-text"></p>

      <div class="cta">
        <span class="cta-label">この関係、ちゃんと視てほしい人へ</span>
        <p>「相手がどう思っているか」「これからどうなるか」は、プロに話しながら視てもらうと一気に整理されます。初回無料特典のある電話占いの比較を準備中です。</p>
        <p class="note">※このサイトはアフィリエイト広告(PR)を利用する予定です</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="index.html">トップ</a>
      <a href="kyou.html">今日の運勢</a>
      <a href="tarot.html">タロット</a>
      <a href="about.html">サイトについて</a>
    </div>
    <div>※占いはエンターテインメントです | © ゆびさき占い</div>
  </footer>

</div>
<script src="js/fortune.js"></script>
<script>
function showAisho() {
  const b1 = document.getElementById("b1").value;
  const b2 = document.getElementById("b2").value;
  if (!b1 || !b2) { alert("ふたりの生年月日を入れてください"); return; }
  const f = aishoUranai(b1, b2);
  document.getElementById("r-pct").textContent = f.pct;
  document.getElementById("r-title").textContent = f.title;
  document.getElementById("r-text").textContent = f.text;
  document.getElementById("result").classList.add("show");
}
</script>
</body>
</html>
