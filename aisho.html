<meta property="og:title" content="ふたりの相性診断 | ゆびさき占い">
<meta property="og:description" content="恋人・片思い・復縁…関係タイプ別に相性とアドバイスがわかる無料診断。">
<meta property="og:type" content="website">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="index.html">🌙 ゆびさき占い</a>
  </header>

  <h1>💞 ふたりの相性診断</h1>
  <p class="lead">ふたりの生年月日と、関係を選ぶだけ。関係に合わせたアドバイスつき。</p>

  <div class="card">
    <label for="b1">あなたの生年月日</label>
    <input type="date" id="b1" min="1930-01-01" max="2012-12-31">
    <label for="b2">相手の生年月日</label>
    <input type="date" id="b2" min="1930-01-01" max="2012-12-31">
    <label for="rel">ふたりの関係</label>
    <select id="rel">
      <option value="koibito">恋人</option>
      <option value="kataomoi">片思い中</option>
      <option value="fukuen">復縁したい相手</option>
      <option value="tomodachi">友達</option>
      <option value="shigoto">仕事の相手</option>
    </select>
    <button class="go" onclick="showAisho()">相性を診断する</button>

    <div class="result" id="result">
      <div class="score"><span id="r-pct">0</span><small> %</small></div>
      <h2 id="r-title" style="text-align:center;"></h2>
      <p id="r-text"></p>

      <div class="cat">
        <span class="c-emoji">💡</span>
        <div class="c-body">
          <div class="c-head"><span id="r-rel-label"></span></div>
          <p id="r-advice"></p>
        </div>
      </div>

      <button class="share" onclick="sharePair()">結果をXでシェア 🕊</button>

      <div class="cta">
        <span class="cta-label">この関係、ちゃんと視てほしい人へ</span>
        <p>「相手がどう思っているか」「これからどうなるか」は、プロに話しながら視てもらうと一気に整理されます。初回最大30分無料のココナラ電話占いから試せます。</p>
        <a class="cta-btn" href="https://px.a8.net/svt/ejp?a8mat=4B88SS+E22K2A+2PEO+BYLJM" rel="nofollow noopener" target="_blank">💫 電話占いココナラを見る（初回最大30分無料）</a>
    <img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4B88SS+E22K2A+2PEO+BYLJM" alt="">
    <p class="note">※本ページはアフィリエイト広告（PR）を含みます</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="index.html">トップ</a>
      <a href="kyou.html">今日の運勢</a>
      <a href="seiza.html">今週の12星座</a>
      <a href="tarot.html">タロット</a>
      <a href="about.html">サイトについて</a>
    </div>
    <div>※占いはエンターテインメントです | © ゆびさき占い</div>
  </footer>

</div>
<script src="js/fortune.js"></script>
<script>
let lastPct = null;
function showAisho() {
  const b1 = document.getElementById("b1").value;
  const b2 = document.getElementById("b2").value;
  const rel = document.getElementById("rel").value;
  if (!b1 || !b2) { alert("ふたりの生年月日を入れてください"); return; }
  const f = aishoUranai(b1, b2, rel);
  lastPct = f.pct;
  countUp(document.getElementById("r-pct"), f.pct);
  document.getElementById("r-title").textContent = f.title;
  document.getElementById("r-text").textContent = f.text;
  document.getElementById("r-rel-label").textContent = f.relLabel + "へのアドバイス";
  document.getElementById("r-advice").textContent = f.advice;
  document.getElementById("result").classList.add("show");
}
function sharePair() {
  if (lastPct === null) return;
  shareX("ふたりの相性は " + lastPct + "% でした💞 #ゆびさき占い");
}
</script>
</body>
</html>
