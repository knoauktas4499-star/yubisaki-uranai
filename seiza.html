<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="index.html">ゆびさき占い</a>
  </header>

  <h1>今週の12星座占い</h1>
  <p class="weekrange" id="range"></p>
  <p class="lead">あなたの星座をタップ。毎週月曜に新しい運勢に変わります。</p>

  <div class="card">
    <div class="seiza-grid" id="grid"></div>

    <div class="result" id="result">
      <div class="stars" id="r-stars" style="margin-top:18px;"></div>
      <h2 id="r-name" style="text-align:center;"></h2>
      <p id="r-text"></p>
      <div class="lucky">
        <div><span>今週のラッキーアクション</span><b id="r-action"></b></div>
      </div>

      <button class="share" onclick="shareSeiza()">今週の運勢をXでシェア</button>

      <div class="cta">
        <span class="cta-label">じっくり視てほしい週は</span>
        <p>「今週どう動くべきか」を自分の状況に合わせて知りたいときは、プロの鑑定が近道です。初回最大30分無料のココナラ電話占いから試せます。</p>
        <a class="cta-btn" href="https://px.a8.net/svt/ejp?a8mat=4B88SS+E22K2A+2PEO+BYLJM" rel="nofollow noopener" target="_blank">電話占いココナラを見る（初回最大30分無料）</a>
    <img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4B88SS+E22K2A+2PEO+BYLJM" alt="">
    <p class="note">※本ページはアフィリエイト広告（PR）を含みます</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="index.html">トップ</a>
      <a href="kyou.html">今日の運勢</a>
      <a href="aisho.html">相性診断</a>

      <a href="about.html">サイトについて</a>

  </footer>

</div>
<script src="js/fortune.js"></script>
<script>
let lastSeiza = null;
document.getElementById("range").textContent = "(" + weekRangeLabel() + " の運勢)";

const grid = document.getElementById("grid");
SEIZA.forEach((s, i) => {
  const b = document.createElement("button");
  b.innerHTML = '<span class="z-emoji">' + s.emoji + '</span>' + s.name + '<span class="z-date">' + s.date + '</span>';
  b.onclick = () => show(i, b);
  grid.appendChild(b);
});

function show(i, btn) {
  document.querySelectorAll(".seiza-grid button").forEach(x => x.classList.remove("active"));
  btn.classList.add("active");
  const f = seizaUranai(i);
  lastSeiza = f;
  localStorage.setItem("yubisaki_seiza", i);
  document.getElementById("r-stars").textContent = f.stars;
  document.getElementById("r-name").textContent = f.emoji + " " + f.name;
  document.getElementById("r-text").textContent = f.text;
  document.getElementById("r-action").textContent = f.action;
  document.getElementById("result").classList.add("show");
}
function shareSeiza() {
  if (!lastSeiza) return;
  shareX(lastSeiza.name + "の今週の運勢 " + lastSeiza.stars + " ⭐ #ゆびさき占い");
}
// 前回選んだ星座を自動表示(リピーターはワンタップ不要)
(function () {
  const saved = localStorage.getItem("yubisaki_seiza");
  if (saved !== null) {
    const btn = document.querySelectorAll(".seiza-grid button")[+saved];
    if (btn) show(+saved, btn);
  }
})();
</script>
</body>
