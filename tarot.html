<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="index.html">ゆびさき占い</a>
  </header>

  <span class="seclabel" style="margin-top:34px;">Tarot</span>

  <h1>タロット1枚引き</h1>
  <p class="lead">目を閉じて、聞きたいことをひとつ思い浮かべてから、カードをタップ。</p>
  <p class="lead"><a href="tarot/index.html">大アルカナ22枚の意味を調べる →</a></p>

  <div class="card">
    <div class="tarot-card" id="card" onclick="draw()" role="button" tabindex="0">
      <span class="cnum" id="c-num">—</span>
      <span class="cname" id="c-name">タップして引く</span>
      <span class="cpos" id="c-pos"></span>
    </div>
    <button class="go" onclick="draw()">カードを1枚引く</button>

    <div class="result" id="result">
      <p id="c-text" style="text-align:left;"></p>
      <button class="go" onclick="draw()" style="margin-top:16px;">もう一度引く</button>
      <button class="share" onclick="shareTarot()">引いたカードをXでシェア</button>

      <div class="cta" style="text-align:left;">
        <span class="cta-label">Consultation</span>
        <p>1枚引きは「今の流れ」のヒント。恋愛や仕事など具体的な悩みは、プロのタロット鑑定で背景まで視てもらえます。初回最大30分無料のココナラ電話占いから試せます。</p>
        <a class="cta-btn" href="https://px.a8.net/svt/ejp?a8mat=4B88SS+E22K2A+2PEO+BYLJM" rel="nofollow noopener" target="_blank">電話占いココナラを見る（初回最大30分無料）</a>
    <img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4B88SS+E22K2A+2PEO+BYLJM" alt="">
    <p class="note">※本ページはアフィリエイト広告（PR）を含みます</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="index.html">トップ</a>
      <a href="kyou.html">今日の運勢</a>

      <a href="about.html">サイトについて</a>
    </div>

  </footer>

</div>
<script src="js/fortune.js"></script>
<script>
let lastCard = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function paintCard(c) {
  document.getElementById("c-num").textContent = c.roman;
  document.getElementById("c-name").textContent = c.name;
  document.getElementById("c-pos").textContent = c.pos;
}
function draw() {
  const c = tarotDraw();
  lastCard = c;
  const el = document.getElementById("card");
  if (reduceMotion) {
    paintCard(c);
  } else {
    el.classList.remove("flip");
    void el.offsetWidth;          // アニメーションを再生し直すための強制リフロー
    el.classList.add("flip");
    setTimeout(() => paintCard(c), 275);  // カードが裏を向いた瞬間に中身を差し替える
  }
  document.getElementById("c-text").textContent = "【" + c.name + "・" + c.pos + "】 " + c.text;
  document.getElementById("result").classList.add("show");
}
// キーボードでも引けるようにする
document.getElementById("card").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); draw(); }
});

function shareTarot() {
  if (!lastCard) return;
  shareX("引いたカードは【" + lastCard.name + "・" + lastCard.pos + "】でした #ゆびさき占い");
}
</script>
</body>
</html>
