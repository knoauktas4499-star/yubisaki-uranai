<meta property="og:title" content="今日の運勢 | ゆびさき占い">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="index.html">🌙 ゆびさき占い</a>
  </header>

  <h1>🔮 今日の運勢</h1>
  <p class="lead">生年月日を入れるだけ。結果は毎日0時に変わります。朝のルーティンにどうぞ。</p>

  <div class="card">
    <label for="birth">あなたの生年月日</label>
    <input type="date" id="birth" min="1930-01-01" max="2012-12-31">
    <button class="go" onclick="showKyou()">今日の運勢を見る</button>

    <div class="result" id="result">
      <div class="stars" id="r-stars"></div>
      <div class="score"><span id="r-score">0</span><small> 点</small></div>
      <p id="r-main" style="margin-top:14px;"></p>

      <div class="cat">
        <span class="c-emoji">💗</span>
        <div class="c-body">
          <div class="c-head"><span>恋愛運</span><span class="c-stars" id="r-love-s"></span></div>
          <p id="r-love-t"></p>
        </div>
      </div>
      <div class="cat">
        <span class="c-emoji">💼</span>
        <div class="c-body">
          <div class="c-head"><span>仕事運</span><span class="c-stars" id="r-work-s"></span></div>
          <p id="r-work-t"></p>
        </div>
      </div>
      <div class="cat">
        <span class="c-emoji">💰</span>
        <div class="c-body">
          <div class="c-head"><span>金運</span><span class="c-stars" id="r-money-s"></span></div>
          <p id="r-money-t"></p>
        </div>
      </div>

      <div class="lucky">
        <div><span>ラッキーカラー</span><b id="r-color"></b></div>
        <div><span>ラッキーアイテム</span><b id="r-item"></b></div>
      </div>

      <button class="share" onclick="shareToday()">今日の運勢をXでシェア 🕊</button>

      <div class="cta">
        <span class="cta-label">もっと深く知りたい人へ</span>
        <p>恋愛・仕事・人間関係など、具体的な悩みは「話して視てもらう」のがいちばん早く整理できます。初回最大30分無料のココナラ電話占いから試せます。</p>
        <a class="cta-btn" href="https://px.a8.net/svt/ejp?a8mat=4B88SS+E22K2A+2PEO+BYLJM" rel="nofollow noopener" target="_blank">💫 電話占いココナラを見る（初回最大30分無料）</a>
    <img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4B88SS+E22K2A+2PEO+BYLJM" alt="">
    <p class="note">※本ページはアフィリエイト広告（PR）を含みます</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="index.html">トップ</a>
      <a href="seiza.html">今週の12星座</a>
      <a href="aisho.html">相性診断</a>
      <a href="tarot.html">タロット</a>
      <a href="about.html">サイトについて</a>
    </div>
    <div>※占いはエンターテインメントです | © ゆびさき占い</div>
  </footer>

</div>
<script src="js/fortune.js"></script>
<script>
let lastScore = null;
function showKyou() {
  const b = document.getElementById("birth").value;
  if (!b) { alert("生年月日を入れてください"); return; }
  localStorage.setItem("yubisaki_birth", b);
  const f = kyouUranai(b);
  lastScore = f.score;
  document.getElementById("r-stars").textContent = f.stars;
  countUp(document.getElementById("r-score"), f.score);
  document.getElementById("r-main").textContent = f.main;
  document.getElementById("r-love-s").textContent = f.love.stars;
  document.getElementById("r-love-t").textContent = f.love.text;
  document.getElementById("r-work-s").textContent = f.work.stars;
  document.getElementById("r-work-t").textContent = f.work.text;
  document.getElementById("r-money-s").textContent = f.money.stars;
  document.getElementById("r-money-t").textContent = f.money.text;
  document.getElementById("r-color").textContent = f.color;
  document.getElementById("r-item").textContent = f.item;
  document.getElementById("result").classList.add("show");
}
function shareToday() {
  if (lastScore === null) return;
  shareX("今日の運勢は " + lastScore + "点 でした🌙 #ゆびさき占い");
}
(function () {
  const saved = localStorage.getItem("yubisaki_birth");
  if (saved) document.getElementById("birth").value = saved;
})();
</script>
</body>
</html>
